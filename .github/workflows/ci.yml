name: Moodle Plugin CI
on:
  push:
    branches: [master]
  workflow_dispatch:
jobs:
  quality:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        moodle-branch: ['MOODLE_405_STABLE', 'MOODLE_500_STABLE']
        php: ['8.2', '8.3']
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: moodle
          POSTGRES_PASSWORD: moodle
          POSTGRES_DB: moodle
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U moodle"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: intl, zip, pgsql, gd, soap, mbstring, xml
          tools: composer:v2
      - name: PHP lint
        run: find . -type f -name '*.php' -print0 | xargs -0 -n1 php -l
      - name: Install validator
        run: git clone --depth=1 https://github.com/EduardoKrausME/moodle-plugin-validate /tmp/moodle-plugin-validate
      - name: Validate and verify canonical formatting
        run: |
          python3 /tmp/moodle-plugin-validate/.chatgpt/run.py "$GITHUB_WORKSPACE"
          python3 /tmp/moodle-plugin-validate/.chatgpt/run.py --check "$GITHUB_WORKSPACE"
          git diff --exit-code
      - name: Install Moodle Plugin CI
        run: composer global require moodlehq/moodle-plugin-ci
      - name: Install Moodle for tests
        env:
          DB: pgsql
          DB_HOST: 127.0.0.1
          DB_PORT: 5432
          DB_USER: moodle
          DB_PASS: moodle
          DB_NAME: moodle
          MOODLE_BRANCH: ${{ matrix.moodle-branch }}
        run: |
          echo "$HOME/.composer/vendor/bin" >> "$GITHUB_PATH"
          echo "$HOME/.config/composer/vendor/bin" >> "$GITHUB_PATH"
          "$HOME/.config/composer/vendor/bin/moodle-plugin-ci" install -vvv
      - name: Moodle Code Checker
        run: moodle-plugin-ci codechecker
      - name: PHPUnit
        run: moodle-plugin-ci phpunit --fail-on-warning
      - name: Behat
        run: moodle-plugin-ci behat
